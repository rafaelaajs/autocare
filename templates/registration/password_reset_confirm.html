<!DOCTYPE html>
<html>
<head>
    <title>Nova Senha</title>

    <style>
        body {
            font-family: 'Segoe UI';
            background: linear-gradient(135deg, #273c75, #40739e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: #273c75;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>🔒 Nova senha</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn">Salvar</button>
    </form>
</div>

</body>
</html>
